{{ if gt .TotalPages 1 }}<nav class="pager" aria-label="Article pages">{{ if .HasPrev }}<a class="button" href="{{ .Prev.URL }}">← Previous</a>{{ end }}<span>Page {{ .PageNumber }} of {{ .TotalPages }}</span>{{ if .HasNext }}<a class="button" href="{{ .Next.URL }}">Next →</a>{{ end }}</nav>{{ end }}
