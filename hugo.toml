baseURL = "https://dormroomfinance.com/"
languageCode = "en-us"
title = "Dorm Room Finance"
theme = "PaperMod"
enableRobotsTXT = true

[pagination]
  pagerSize = 12

[params]
  env = "production"
  title = "Dorm Room Finance"
  description = "Practical money guides for college students and new grads. Build credit, plan your spending, and make your first paycheck count."
  keywords = ["college finance", "student money", "budgeting in college", "investing for college students", "student credit cards"]
  author = "Colin Pogue"
  mainSections = ["posts"]
  DateFormat = "January 2, 2006"
  defaultTheme = "light"
  disableThemeToggle = true
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = "Real money advice for college students."
    Content = "No jargon, no fluff. Just what you actually need to know about credit, investing, budgeting, and building a financial foundation before graduation — written by a business student figuring it out in real time."

  [[params.socialIcons]]
    name = "email"
    url = "mailto:cpogue208@gmail.com"

[taxonomies]
  category = "categories"
  tag = "tags"

[menu]
  [[menu.main]]
    identifier = "articles"
    name = "Articles"
    url = "/articles/"
    weight = 10
  [[menu.main]]
    identifier = "categories"
    name = "Categories"
    url = "/categories/"
    weight = 20
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 30
  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "mailto:cpogue208@gmail.com"
    weight = 40

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2

[outputs]
  home = ["HTML", "RSS", "JSON"]

[[menu.main]]
  identifier = "start"
  name = "Start here"
  url = "/start-here/"
  weight = 1
[[menu.main]]
  identifier = "tools"
  name = "Free tools"
  url = "/tools/"
  weight = 15
[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 50

[params.assets]
  favicon = "/drf-mark-v2.ico"
  favicon16x16 = "/drf-mark-v2-16.png"
  favicon32x32 = "/drf-mark-v2-32.png"
  apple_touch_icon = "/drf-mark-v2-180.png"
